# Started by Codespaces, VS Code, or `npx @constat-io/cli try`. Local values only: never a real secret.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 2s, retries: 30 }
  app:
    image: node:22
    working_dir: /app
    volumes: ["..:/app", "node_modules:/app/node_modules"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      WATCHPACK_POLLING: "true"
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run try:prepare && npm run dev -- -H 0.0.0.0"]
    ports: ["${TRY_PORT:-3000}:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  node_modules: {}
